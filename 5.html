<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Landing Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
    }

    nav .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #fff;
    }

    nav .nav-links {
      display: flex;
      gap: 25px;
    }

    nav .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      position: relative;
    }

    nav .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: #1DB954;
      transition: width 0.3s ease;
    }

    nav .nav-links a:hover::after {
      width: 100%;
    }

    /* Hero Section */
    header {
      height: 100vh;
      background: url('pexels-philippedonn-1114690.jpg') center/cover no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }

    header h1 {
      font-size: 4rem;
      z-index: 1;
      animation: fadeIn 1.5s ease-in-out;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Gallery Section */
    .gallery {
      display: flex;
      overflow-x: scroll;
      gap: 20px;
      padding: 60px 20px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    .gallery img {
      height: 400px;
      border-radius: 10px;
      scroll-snap-align: center;
      transition: transform 0.4s;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Music Section */
    .music {
      padding: 60px 20px;
      text-align: center;
    }

    .music h2 {
      margin-bottom: 20px;
      font-weight: 600;
    }

    .music iframe {
      width: 100%;
      max-width: 400px;
      height: 80px;
      margin: 20px auto;
      border-radius: 10px;
      border: none;
      display: block;
    }

    /* Social Media Icons */
    .socials {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px;
    }

    .socials a {
      font-size: 2.5rem;
      color: #aaa;
      transition: color 0.3s, transform 0.3s;
    }

    .socials a:hover {
      transform: scale(1.2);
    }

    .socials a.instagram:hover { color: #E1306C; }
    .socials a.spotify:hover   { color: #1DB954; }
    .socials a.youtube:hover   { color: #FF0000; }
    .socials a.tiktok:hover    { color: #69C9D0; }

    @media(max-width: 768px) {
      header h1 {
        font-size: 2.5rem;
      }
      nav .nav-links {
        display: none;
      }
      .gallery img {
        height: 250px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">Artist Name</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#music">Music</a>
      <a href="#socials">Socials</a>
    </div>
  </nav>

  <header>
    <h1>ARTIST NAME</h1>
  </header>

  <section class="gallery">
    <img src="C:\Users\User\Desktop\MyWebsite\a3080312-942e-4c9d-a497-2c5f6ab9db3c.jpg" alt="Gallery Image 1"/>
    <img src="C:\Users\User\Desktop\MyWebsite\kev.png" alt="Gallery Image 2" />
    <img src="C:\Users\User\Desktop\MyWebsite\dan.png" alt="Gallery Image 3" />
  </section>

  <section class="music" id="music">
    <h2>Listen on Spotify</h2>
    <iframe src="https://open.spotify.com/embed/track/xxxx" allow="encrypted-media" allowfullscreen></iframe>
    <iframe src="https://open.spotify.com/embed/track/yyyy" allow="encrypted-media" allowfullscreen></iframe>
  </section>

  <section class="socials" id="socials">
    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" class="instagram" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="https://spotify.com" target="_blank" rel="noopener noreferrer" class="spotify" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
    <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="youtube" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" class="tiktok" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
  </section>
</body>
</html>

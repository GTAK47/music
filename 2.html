<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sänger Landing Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: white;
      overflow-x: hidden;
    }

    header {
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent), url('Landing/pexels-philippedonn-1114690.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      font-size: 3rem;
      animation: fadeInDown 1s ease-out;
    }

    header p {
      font-size: 1.3rem;
      margin-top: 1rem;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .social-links {
      display: flex;
      gap: 20px;
      margin-top: 2rem;
      justify-content: center;
    }

    .social-links a {
      color: white;
      font-size: 1.8rem;
      text-decoration: none;
      transition: transform 0.3s, color 0.3s;
    }

    .social-links a:hover {
      transform: scale(1.2);
      color: #1DB954;
    }

    .gallery {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 10px;
      padding: 20px;
      background-color: #111;
    }

    .gallery img {
      height: 300px;
      scroll-snap-align: center;
      border-radius: 10px;
      transition: transform 0.4s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .music {
      padding: 40px 20px;
      text-align: center;
      background-color: #000;
    }

    .music iframe {
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      height: 80px;
      margin: 10px auto;
    }

    .cta {
      background: #1DB954;
      padding: 15px 30px;
      color: black;
      font-weight: bold;
      border: none;
      border-radius: 30px;
      margin-top: 2rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .cta:hover {
      background: #17a74a;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: #aaa;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header>
    <h1>Max Mustermann</h1>
    <p>Urban Beats & Soulful Vibes</p>
    <div class="social-links">
      <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="#" target="_blank"><i class="fab fa-youtube"></i></a>
      <a href="#" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="#" target="_blank"><i class="fab fa-spotify"></i></a>
    </div>
    <a href="#music"><button class="cta">Jetzt reinhören</button></a>
  </header>

  <section class="gallery">
    <img src="dan.png" alt="Gallery 1">
    <img src="Danco/kev.png" alt="Gallery 2">
    <img src="img3.jpg" alt="Gallery 3">
    <img src="img4.jpg" alt="Gallery 4">
  </section>

  <section class="music" id="music">
    <h2>Top Tracks</h2>
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/4cOdK2wGLETKBW3PvgPWqT" allow="encrypted-media"></iframe>
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/5CtI0qwDJkDQGwXD1H1cLb" allow="encrypted-media"></iframe>
  </section>

  <footer>
    &copy; 2025 Max Mustermann — Alle Rechte vorbehalten
  </footer>
</body>
</html>

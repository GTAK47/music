<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DANCO & NEMA</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: black;
    }

    .container {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .box {
      flex: 1;
      transition: flex 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      transform: scale(0.9);
      filter: brightness(0.8);
    }

    .box:hover {
      flex: 1.1;
    }

    .box:not(:hover) {
      flex: 0.9;
    }

    .box:hover img {
      transform: scale(1.05);
      filter: brightness(1);
    }

    .box .text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      display: inline-block;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px 30px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
    }

    .box .text:hover {
      background-color: rgba(0, 0, 0, 0.75);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box">
      <img src="dan.png" alt="Box 1" />
      <a href="altbau/altbau.html" class="text">DANCO</a>
    </div>
    <div class="box">
      <img src="kev.png" alt="Box 2" />
      <a href="page2.html" class="text">NEMA</a>
    </div>
  </div>

</body>
</html>

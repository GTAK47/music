<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artist Landing Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
    }

    nav .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav .nav-links {
      display: flex;
      gap: 25px;
    }

    nav .nav-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      position: relative;
    }

    nav .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0;
      height: 2px;
      background: #1DB954;
      transition: width 0.3s ease;
    }

    nav .nav-links a:hover::after {
      width: 100%;
    }

    /* Hero Section */
    header {
      height: 100vh;
      background-image: url('Landing/pexels-philippedonn-1114690.jpg'); /* <-- Bild im selben Ordner */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      background: rgba(0,0,0,0.5);
    }

    header h1 {
      font-size: 4rem;
      z-index: 1;
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Gallery Section */
    .gallery {
      display: flex;
      overflow-x: scroll;
      gap: 20px;
      padding: 60px 20px;
      scroll-snap-type: x mandatory;
    }

    .gallery img {
      height: 400px;
      border-radius: 10px;
      scroll-snap-align: center;
      transition: transform 0.4s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Music Section */
    .music {
      padding: 60px 20px;
      text-align: center;
    }

    .music iframe {
      width: 100%;
      max-width: 400px;
      height: 80px;
      margin: 20px auto;
      border-radius: 10px;
      border: none;
    }

    /* Social Media Icons */
    .socials {
      display: flex;
      justify-content: center;
      gap: 30px;
      padding: 40px;
    }

    .socials a {
      font-size: 2rem;
      color: #aaa;
      transition: color 0.3s, transform 0.3s;
    }

    .socials a:hover {
      transform: scale(1.2);
    }

    .socials a.instagram:hover { color: #E1306C; }
    .socials a.spotify:hover   { color: #1DB954; }
    .socials a.youtube:hover   { color: #FF0000; }
    .socials a.tiktok:hover    { color: #69C9D0; }

    @media(max-width: 768px) {
      header h1 { font-size: 2.5rem; }
      nav .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">GTAK47</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#music">Music</a>
      <a href="#socials">Socials</a>
    </div>
  </nav>

  <header>
    <h1>GTAK47</h1>
  </header>

  <section class="gallery">
    <img src="img1.jpg" alt="Gallery Image 1">
    <img src="img2.jpg" alt="Gallery Image 2">
    <img src="img3.jpg" alt="Gallery Image 3">
  </section>

  <section class="music" id="music">
    <h2>Listen on Spotify</h2>
    <iframe src="https://open.spotify.com/embed/track/xxxx"></iframe>
    <iframe src="https://open.spotify.com/embed/track/yyyy"></iframe>
  </section>

  <section class="socials" id="socials">
    <a href="#" class="instagram" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
    <a href="#" class="spotify" aria-label="Spotify"><i class="fab fa-spotify"></i></a>
    <a href="#" class="youtube" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    <a href="#" class="tiktok" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
  </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemeindebau Abi GmbH</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: black;
    }

    /* Navigation Bar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      position: absolute;
      top: 0;
      width: 100%;
      z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    nav .logo {
      font-size: 1.5rem;
      font-weight: bold;
    }

    nav .menu {
      display: flex;
      gap: 25px;
      position: relative;
    }

    nav .menu .dropdown-container {
      position: relative;
    }

    nav .menu button {
      background-color: transparent;
      color: white;
      border: 2px solid white;
      padding: 14px 18px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
      width: 65px;
      height: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    nav .menu button:hover {
      background-color: white;
      color: black;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.5);
    }

    nav .menu .dropdown {
      display: none;
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 10px 0;
      min-width: 120px;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.3s ease, visibility 0s 0.3s;
    }

    nav .menu .dropdown a {
      display: block;
      padding: 10px;
      color: black;
      text-decoration: none;
      font-size: 0.9rem;
      text-align: center;
      transition: background-color 0.3s ease;
    }

    nav .menu .dropdown a:hover {
      background-color: #f0f0f0;
    }

    nav .menu .dropdown-container:hover .dropdown,
    nav .menu .dropdown-container:hover button {
      display: block;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease, visibility 0s 0s;
    }

    .container {
      display: flex;
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .box {
      flex: 1;
      transition: flex 0.5s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }

    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
      transform: scale(0.9); /* rausgezoomt */
    }

    .box:hover {
      flex: 1.1;
    }

    .box:not(:hover) {
      flex: 0.9;
    }

    .box:hover img {
      transform: scale(1.05);
      filter: brightness(1);
    }

    .box-1,
    .box-2 {
      background: transparent;
    }

    .box-1 img,
    .box-2 img {
      filter: brightness(0.8);
    }

    .box-1 .text,
    .box-2 .text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      text-align: center;
      display: inline-block;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 15px 30px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .box .text:hover {
      background-color: rgba(0, 0, 0, 0.75);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <div class="logo">Gemeindebau Abi GmbH</div>
    <div class="menu">
      <div class="dropdown-container">
        <button>Kontakt</button>
        <div class="dropdown">
          <a href="#home-1">Sub Home 1</a>
          <a href="#home-2">Sub Home 2</a>
          <a href="#home-3">Sub Home 3</a>
        </div>
      </div>
      <div class="dropdown-container">
        <button>Mieter</button>
        <div class="dropdown">
          <a href="#about-1">Sub About 1</a>
          <a href="#about-2">Sub About 2</a>
          <a href="#about-3">Sub About 3</a>
        </div>
      </div>
      <div class="dropdown-container">
        <button>Vermieter</button>
        <div class="dropdown">
          <a href="#contact-1">Sub Contact 1</a>
          <a href="#contact-2">Sub Contact 2</a>
          <a href="#contact-3">Sub Contact 3</a>
        </div>
      </div>
      <div class="dropdown-container">
        <button>Hilfe</button>
        <div class="dropdown">
          <a href="#help-1">Sub Help 1</a>
          <a href="#help-2">Sub Help 2</a>
          <a href="#help-3">Sub Help 3</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Image Section -->
  <div class="container">
    <div class="box box-1">
      <img src="dan.png" alt="Box 1" />
      <a href="altbau/altbau.html" class="text">DANCO</a>
    </div>
    <div class="box box-2">
      <img src="kev.png" alt="Box 2" />
      <a href="page2.html" class="text">NEMA</a>
    </div>
  </div>

</body>
</html>
